<!DOCTYPE html>
<html>
  <head>
    <title>AI Application Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
      @layer base {
        body {
          font-family: "Noto Sans TC", sans-serif;
        }
      }
    </style>
  </head>
  <body class="h-screen rounded-lg">
    <header x-data="TitleBar()" class="fixed top-0 right-0 w-[calc(100%-8vw)] bg-white" style="-webkit-app-region: drag;">
      <div class="flex items-center justify-between border-b border-[#F3F4F6] py-3 px-6 text-[#1E2939]">
        <div class="flex items-center gap-x-4">
          <img src="./assets/icons/logo.svg" class="size-10" />
          <p class="text-2xl font-medium text-[##333333]">
            Asus AI Hub
          </p>
        </div>
        <div class="flex items-center gap-2" style="-webkit-app-region: no-drag;">
          <button class="hover:bg-gray-200 rounded focus:outline-none">
            <img src="./assets/icons/qa.svg" class="size-9" />
          </button>
          <button @click="maximizeWindow()" class="hover:bg-gray-200 rounded focus:outline-none">
            <img src="./assets/icons/zoom-in.svg" class="size-9" />
          </button>
          <button @click="closeWindow()" class="hover:bg-gray-200 rounded focus:outline-none">
            <img src="./assets/icons/close.svg" class="size-9" />
          </button>
        </div>
      </div>

      <div class="flex items-center gap-x-2 py-3 px-6 border-b border-[#F3F4F6]">
        <div class="size-3 bg-[#00C950] rounded-full"></div>
        <p class="text-[#333333]">Server Connection</p>
      </div>
    </header>

    <section class="fixed left-0 top-0 w-[8vw] pt-8 h-full bg-gradient-to-b from-[#2B7FFF] via-[#51A2FF] to-[#00D3F2]">
      <div class="flex flex-col gap-y-6 mx-auto">
        <a href="./index.html" class="flex items-center justify-center rounded-[10px] size-12 mx-auto p-3 bg-white/10 hover:bg-white/38 shadow-md">
          <img src="./assets/sidebar/home.svg" class="size-6" alt="ASUS Logo" />
        </a>
        <a href="./history.html" class="flex items-center justify-center rounded-[10px] size-12 mx-auto p-3 bg-white/10 hover:bg-white/38 shadow-md">
          <img src="./assets/sidebar/installed.svg" class="size-6" alt="ASUS Logo" />
        </a>
        <a href="./asus.html" class="flex items-center justify-center rounded-[10px] size-12 mx-auto p-3 bg-white/38 shadow-md">
          <img src="./assets/sidebar/hardwareinfo.svg" class="size-6" alt="ASUS Logo" />
        </a>
      </div>
    </section>

    <section class="pt-28 pl-[8vw] h-full">
      <div x-data="hardwareChecker()" class="overflow-y-auto p-6">
        <div class="flex justify-between items-center">
          <p class="text-[#1E2939] font-medium text-lg">硬體設備與資源檢測</p>
          <div>
            <button :class="{'!block': status == 'initial'}" class="hidden cursor-pointer px-2.5 py-2 rounded-md border border-[#0D51CD] text-sm font-medium text-[#0D51CD] hover:text-[#0D51CD]/70" @click="checkHardware()">開始檢測</button>
            <button :class="{'!block': status == 'finished'}" class="hidden cursor-pointer px-2.5 py-2 rounded-md border border-[#0D51CD] text-sm font-medium text-[#0D51CD] hover:text-[#0D51CD]/70" @click="downloadReport()">下載檢測報告</button>
          </div>
        </div>

        <div :class="{'!block': status == 'finished'}" class="hidden rounded-2xl shadow-[0px_2px_4px_rgba(0,0,0,0.2)] mt-4">
          <div class="px-6 py-3 font-medium text-[#1E2939] text-lg">系統環境配置 System Environment</div>
          <dl class="flex border border-[#CCE1FF] text-sm bg-[#F4F9FF] font-medium text-[#0C61D4]">
            <dd class="w-50 p-4">項目</dd>
            <dd class="flex-1 p-4">檢測規格</dd>
            <dd class="w-50 p-4">檢測結果</dd>
          </dl>
          <dl class="flex text-sm font-medium text-[#333333]">
            <dd class="w-50 p-4">作業系統 (OS)</dd>
            <dd class="flex-1 p-4" x-text="os"></dd>
            <dd class="w-50 p-4">
              <div class="flex items-center" x-show="os != ''">
                <p class="text-sm text-[#00C950]">通過</p>
                <img src="./assets/icons/pass.svg" class="size-6" />
              </div>
            </dd>
          </dl>
          <dl class="flex text-sm font-medium text-[#333333]">
            <dd class="w-50 p-4">CPU</dd>
            <dd class="flex-1 flex p-4">
              <span x-text="cpu"></span>核心數&nbsp;<span x-text="cpuCores"></span>
            </dd>
            <dd class="w-50 p-4">
              <div class="flex items-center" x-show="cpu != ''">
                <p class="text-sm text-[#00C950]">通過</p>
                <img src="./assets/icons/pass.svg" class="size-6" />
              </div>
            </dd>
          </dl>
          <dl class="flex text-sm font-medium text-[#333333]">
            <dd class="w-50 p-4">GPU</dd>
            <dd class="flex-1 p-4">
              <template x-for="(gpu, index) in graphics" :key="index">
                <div>
                  <span x-text="gpu"></span>
                </div>
              </template>
            </dd>
            <dd class="w-50 p-4">
              <div class="flex items-center" x-show="graphics.length > 0">
                <p class="text-sm text-[#00C950]">通過</p>
                <img src="./assets/icons/pass.svg" class="size-6" />
              </div>
            </dd>
          </dl>
          <dl class="flex text-sm font-medium text-[#333333]">
            <dd class="w-50 p-4">NVIDIA Driver</dd>
            <dd class="flex-1 p-4" x-text="driverVersion"></dd>
            <dd class="w-50 p-4">
              <div class="flex items-center" x-show="driverVersion != '' && driverVersion != 'Unknown' && driverVersion != undefined">
                <p class="text-sm text-[#00C950]">通過</p>
                <img src="./assets/icons/pass.svg" class="size-6" />
              </div>
              <div class="flex items-center" x-show="driverVersion == '' || driverVersion == 'Unknown' || driverVersion == undefined">
                <p class="text-sm text-[#F19F00]">未安裝</p>
                <img src="./assets/icons/uninstall.svg" class="size-6" />
              </div>
            </dd>
          </dl>
          <dl class="flex text-sm font-medium text-[#333333]">
            <dd class="w-50 p-4">RAM 容量</dd>
            <dd class="flex-1 p-4">
              <span x-text="memory"></span> GB
            </dd>
            <dd class="w-50 p-4">
              <div class="flex items-center" x-show="memory != ''">
                <p class="text-sm text-[#00C950]">通過</p>
                <img src="./assets/icons/pass.svg" class="size-6" />
              </div>
            </dd>
          </dl>
          <dl class="flex text-sm font-medium text-[#333333]">
            <dd class="w-50 p-4">硬碟剩餘空間</dd>
            <dd class="flex-1 p-4" x-text="diskC.display"></dd>
            <dd class="w-50 p-4">
              <div class="flex items-center" x-show="diskC.display != ''">
                <p class="text-sm text-[#00C950]">通過</p>
                <img src="./assets/icons/pass.svg" class="size-6" />
              </div>
            </dd>
          </dl>
        </div>
        
        <!-- Main modal -->
        <div :class="{'!flex': status == 'fetching'}" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center h-screen w-full md:inset-0 bg-black/30">
          <!-- Modal body -->
          <div class="relative flex flex-col items-center bg-white rounded-xl shadow-2xl p-6 w-115">
            <div class="relative flex items-center justify-center rounded-full bg-[#E6FAFD] size-40">
              <img src="./assets/icons/hardware-checking.png" class="size-26" />
              <div class="absolute top-1/2 -translate-y-1/2 left-1/2 -translate-x-1/2" role="status">
                <svg aria-hidden="true" class="size-6.5 text-[#01D3F3] animate-spin fill-brand" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/><path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="#fff"/></svg>
                <span class="sr-only">Loading...</span>
              </div>
            </div>

            <p class="mt-6 text-lg font-medium">環境檢測中</p>
            <p class="mt-2 text-lg">正在檢測系統環境配置</p>
            <div class="flex justify-between w-full mt-10 text-[#333333]/80 text-xs">
              <p>檢測進度</p>
              <p>請稍候...</p>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
              <div class="bg-[#00B8DB] h-2 rounded-full transition-all duration-300" :style="`width: ${progress}%`"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script src="./alpine/hardwareChecker.js"></script>
    <script src="./alpine/titleBar.js"></script>
  </body>
</html>
